name: CI

# Runs the headless test suite (tests.yml), the StyLua format check and luacheck on every push to main
# and on every pull request. build.yml calls tests.yml directly, so only the tests gate a release;
# format and lint stay informational here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format (StyLua)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Informational until the tree is formatted with StyLua (about 140 files differ today, mostly aligned
    # `=` padding). Remove this line to make it block merges once that pass lands.
    continue-on-error: true
    env:
      # Pinned so a new StyLua release cannot reformat the tree under us. Keep in step with local installs.
      STYLUA_VERSION: "2.0.2"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install StyLua
        run: |
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip" \
            -o stylua.zip
          mkdir -p ~/bin
          unzip -o stylua.zip -d ~/bin
          chmod +x ~/bin/stylua
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show StyLua version
        run: stylua --version

      - name: Check formatting
        # Config comes from .stylua.toml at the repo root (2-space indent, 120 columns).
        run: stylua --check game tests tools

  lint:
    name: Lint (luacheck, informational)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Informational until the existing warnings are cleared. Remove this line to make it block merges.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install luacheck
        run: |
          # Runner images ship stale package lists; refresh them or the install can 404.
          sudo apt-get update
          sudo apt-get -y install luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        # Config comes from .luacheckrc at the repo root.
        run: luacheck game tests tools

  tests:
    uses: ./.github/workflows/tests.yml
