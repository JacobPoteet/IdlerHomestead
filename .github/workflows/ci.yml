name: CI

# Runs the headless test suite and the formatter check on every push to main and on every pull request.
# build.yml also calls this workflow (workflow_call), so a release tag cannot publish while tests fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format (StyLua)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Informational until the tree is formatted with StyLua (about 140 files differ today, mostly aligned
    # `=` padding). Remove this line to make it block merges once that pass lands.
    continue-on-error: true
    env:
      # Pinned so a new StyLua release cannot reformat the tree under us. Keep in step with local installs.
      STYLUA_VERSION: "2.0.2"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install StyLua
        run: |
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip" \
            -o stylua.zip
          mkdir -p ~/bin
          unzip -o stylua.zip -d ~/bin
          chmod +x ~/bin/stylua
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show StyLua version
        run: stylua --version

      - name: Check formatting
        # Config comes from .stylua.toml at the repo root (2-space indent, 120 columns).
        run: stylua --check game tests tools

  lint:
    name: Lint (luacheck, informational)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Informational until the existing warnings are cleared. Remove this line to make it block merges.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install luacheck
        run: |
          sudo apt-get -y install luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        # Config comes from .luacheckrc at the repo root.
        run: luacheck game tests tools

  tests:
    name: Tests (LÖVE 11.5)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      LOVE_VERSION: "11.5"
      # The test runner disables the window, graphics and audio modules, but make any stray SDL
      # initialisation harmless on a display-less runner.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Cache LÖVE AppImage
        id: cache-love
        uses: actions/cache@v4
        with:
          path: ~/love-cache
          key: love-${{ env.LOVE_VERSION }}-x86_64-appimage

      - name: Download LÖVE
        if: steps.cache-love.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/love-cache
          curl -fsSL --retry 5 --retry-delay 10 --connect-timeout 30 --max-time 300 \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage" \
            -o ~/love-cache/love.AppImage
          chmod +x ~/love-cache/love.AppImage

      - name: Extract LÖVE (no FUSE needed)
        run: |
          mkdir -p ~/love-extract
          cd ~/love-extract
          ~/love-cache/love.AppImage --appimage-extract > /dev/null
          # A small wrapper that runs the AppImage's own AppRun (sets up its bundled libraries).
          mkdir -p ~/bin
          printf '#!/bin/sh\nexec "%s/love-extract/squashfs-root/AppRun" "$@"\n' "$HOME" > ~/bin/love
          chmod +x ~/bin/love
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show LÖVE version
        run: love --version

      - name: Run tests
        # tests/main.lua exits 1 if any test fails or a test file errors, which fails this step.
        # shell: bash enables pipefail, so love's exit code survives the pipe to tee.
        shell: bash
        run: love tests | tee test-output.txt

      - name: Summarise results
        if: always()
        run: |
          {
            echo '### Test result'
            echo '```'
            # Every failure (with the lines of its traceback) plus the totals line. Falls back to the tail
            # if the run died before printing a summary.
            grep -E -A 4 '^FAIL |passed, [0-9]+ failed' test-output.txt || tail -n 40 test-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
